services:
  api:
    environment:
      TELEGRAM_ENABLED: "true"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
    secrets:
      - telegram_bot_token
      - telegram_webhook_secret

secrets:
  telegram_bot_token:
    file: /srv/platform/secrets/mercamicro_presupuestos_telegram_token
  telegram_webhook_secret:
    file: /srv/platform/secrets/mercamicro_presupuestos_telegram_webhook_secret
